# ============================================================================
# jobs/db-schema-init.yaml — create the 6 MOSIP databases
# ----------------------------------------------------------------------------
# Purpose      : idempotently CREATE DATABASE for mosip_master, mosip_kernel,
#                mosip_keymgr, mosip_audit, mosip_idrepo, mosip_idmap.
#                Schemas inside each DB are created by the MOSIP services
#                at boot (Flyway / hand-rolled SQL via mosip-config).
# Dependencies : mosip-postgres Ready; Secret mosip-postgres-superuser exists.
# Override     : Lead can add DBs by editing the bash loop. ttl 86400 so the
#                Job auto-cleans within 24h.
# Gotchas      :
#   - Postgres has no `CREATE DATABASE IF NOT EXISTS` — we use the well-known
#     `\gexec` trick to check pg_database first.
#   - restartPolicy OnFailure + backoffLimit 4 covers postgres warm-up races.
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema-init
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: db-schema-init
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-schema-init
        app.kubernetes.io/component: bootstrap
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      restartPolicy: OnFailure
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: psql
          image: docker.io/library/postgres:15-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: "mosip-postgres.iun-mosip-dev.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            - name: PGDATABASE
              value: "postgres"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosip-postgres-superuser
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "[init] waiting for postgres..."
              for i in $(seq 1 30); do
                if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
                  echo "[init] postgres is ready"
                  break
                fi
                echo "[init] not ready yet ($i/30), sleeping 5s"
                sleep 5
              done
              for DB in mosip_master mosip_kernel mosip_keymgr mosip_audit mosip_idrepo mosip_idmap; do
                echo "[init] ensuring DB $DB"
                psql -v ON_ERROR_STOP=1 <<SQL
              SELECT 'CREATE DATABASE $DB'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$DB')\gexec
              SQL
                echo "[init] $DB OK"
              done
              echo "[init] all 6 databases ensured"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
