# ============================================================================
# 07-keymanager.yaml — MOSIP Keymanager service
# ----------------------------------------------------------------------------
# Purpose      : owns ROOT, KERNEL, IDA, ID_REPO master keys. PKCS#11 client
#                to softhsm. Every key/sign/encrypt operation in MOSIP routes
#                here.
# Dependencies : config-server Ready; softhsm-kernel Ready (PVC initialised);
#                postgres Ready with mosip_keymgr DB; conf-secrets present.
# Override     : Lead can split this to dedicated SoftHSM/HSM-network mode
#                via overlay.
# Gotchas      :
#   - strategy: Recreate — softhsm PVC is RWO and must detach from old pod
#     before new pod attaches (PITFALLS.md section 11).
#   - Mounts the SAME PVC as 03-softhsm.yaml (softhsm-kernel-tokens-softhsm-kernel-0).
#     This means keymanager + softhsm STS must be on the same node OR move
#     PVC to RWX in overlay. For MVP we use podAffinity to colocate.
#   - Image tag 1.2.0.1 — verify on hub.docker.com/r/mosipid/keymanager-service.
#     Upstream tag history says 1.2.0.1 exists; fallback :1.2.0.4 or :develop.
#   - Health on /actuator/health on 8088.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: keymanager
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: keymanager
    app.kubernetes.io/component: kernel
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      protocol: TCP
  selector:
    app.kubernetes.io/name: keymanager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keymanager
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: keymanager
    app.kubernetes.io/component: kernel
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — re-check hub.docker.com/r/mosipid/keymanager-service before apply"
    iun.sn/pvc-sharing-note: "Mounts softhsm RWO PVC — strategy=Recreate + podAffinity to softhsm-kernel"
spec:
  replicas: 1
  strategy:
    type: Recreate         # RWO PVC sharing with softhsm
  selector:
    matchLabels:
      app.kubernetes.io/name: keymanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keymanager
        app.kubernetes.io/component: kernel
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      affinity:
        # Colocate with softhsm-kernel pod so the RWO PVC can be mounted on
        # the same node. RWX overlay in prod removes this constraint.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: softhsm-kernel
              topologyKey: kubernetes.io/hostname
      containers:
        - name: keymanager
          # IMAGE TAG: verify before apply — fallback :1.2.0.4 or :develop
          image: docker.io/mosipid/keymanager-service:1.2.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          envFrom:
            - configMapRef:
                name: global
            - secretRef:
                name: conf-secrets
          env:
            - name: spring_config_label_env
              value: "master"
            - name: active_profile_env
              value: "default"
            - name: spring_config_url_env
              value: "http://config-server.iun-mosip-dev.svc.cluster.local:8888"
            - name: softhsm_security_pin
              value: "iun-dev-pin"
            - name: SERVER_PORT
              value: "8088"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: softhsm-tokens
              mountPath: /softhsm/tokens
      volumes:
        - name: softhsm-tokens
          persistentVolumeClaim:
            # The PVC auto-created by the softhsm-kernel StatefulSet
            # volumeClaimTemplate. Name pattern: <vct>-<sts>-<ordinal>.
            claimName: tokens-softhsm-kernel-0
