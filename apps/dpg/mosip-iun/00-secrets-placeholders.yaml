# ============================================================================
# 00-secrets-placeholders.yaml — DOC ONLY (no live K8s object here)
# ----------------------------------------------------------------------------
# Runtime Secrets are created by PowerShell scripts, NOT this manifest, so
# values never land in git. The scripts that create them:
#
#   01-secrets.ps1 — creates in `iun-mosip-dev`:
#     * docker-hub-creds       (kubernetes.io/dockerconfigjson — duplicated
#                               from iun-bootstrap)
#     * mosip-postgres-superuser
#           keys: password
#     * conf-secrets           (the catch-all MOSIP service secret)
#           keys: db_dbuser_password, mosip_keymanager_pin,
#                 mosip_softhsm_kernel_pin, mosip_softhsm_ida_pin,
#                 mosip_kafka_username, mosip_kafka_password,
#                 mosip_artifactory_pass, mosip_iam_admin_password,
#                 mosip_keycloak_pms_client_secret, ...
#
# This file is left in `resources:` so `kubectl apply -k` does not fail,
# and so the contract (filename + path) is preserved for the PS driver.
#
# This is intentionally a no-op ConfigMap stub — it gets overwritten/ignored
# at runtime. NEVER put real secret material here.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-placeholder-notice
  namespace: iun-mosip-dev
  labels:
    iun.sn/role: documentation
  annotations:
    iun.sn/note: "See 01-secrets.ps1 for the real Secret objects."
data:
  README: |
    Secrets for this namespace are created out-of-band by PS scripts.
    Do not put real credentials in git.
