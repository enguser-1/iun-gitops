# ============================================================================
# 09-kernel-masterdata.yaml — Kernel Masterdata service
# ----------------------------------------------------------------------------
# Purpose      : CRUD on masterdata entities (locations, genders, doc types,
#                templates, blacklisted words, machine specs, ...). Required
#                by idgenerator only for `restricted-numbers` / lookup hooks.
# Dependencies : config-server Ready; kernel-auth Ready; postgres Ready with
#                mosip_master schema initialised (db-schema-init.yaml + the
#                masterdata-loader.yaml seed Job).
# Override     : nothing application-level for MVP. Lead can split read/write
#                replicas via overlay later.
# Gotchas      :
#   - Image tag 1.2.0.1 — verify on hub.docker.com/r/mosipid/kernel-masterdata-service.
#     Fallback :1.2.0.4 or :develop.
#   - DB connection string is built by Spring from global CM
#     `mosip-postgres-host` + conf-secrets `db_dbuser_password`.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kernel-masterdata-service
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: kernel-masterdata-service
    app.kubernetes.io/component: kernel
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8088
      targetPort: 8088
      protocol: TCP
  selector:
    app.kubernetes.io/name: kernel-masterdata-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernel-masterdata-service
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: kernel-masterdata-service
    app.kubernetes.io/component: kernel
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — re-check hub.docker.com/r/mosipid/kernel-masterdata-service before apply"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kernel-masterdata-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kernel-masterdata-service
        app.kubernetes.io/component: kernel
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: kernel-masterdata-service
          # IMAGE TAG: verify before apply — fallback :1.2.0.4 or :develop
          image: docker.io/mosipid/kernel-masterdata-service:1.2.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
          envFrom:
            - configMapRef:
                name: global
            - secretRef:
                name: conf-secrets
          env:
            - name: spring_config_label_env
              value: "master"
            - name: active_profile_env
              value: "default"
            - name: spring_config_url_env
              value: "http://config-server.iun-mosip-dev.svc.cluster.local:8888"
            - name: SERVER_PORT
              value: "8088"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
