# ============================================================================
# 04-kafka.yaml — Kafka KRaft single-node (no Zookeeper)
# ----------------------------------------------------------------------------
# Purpose      : message bus for MOSIP services (audit events, key rotation
#                signals, etc.). Single-broker, KRaft mode.
# Dependencies : namespace bootstrap.
# Override     : Lead can scale to 3 replicas; will need a separate StorageClass
#                line + KRAFT_CONTROLLER_QUORUM_VOTERS update via overlay.
# Gotchas      :
#   - bitnami/kafka:3.7 expects ALLOW_PLAINTEXT_LISTENER=yes in dev.
#   - Headless Service `kafka` resolves kafka-0.kafka.<ns>.svc... for the
#     StatefulSet pod DNS; a second ClusterIP Service `kafka` is NOT possible
#     under the same name, so we use ONE headless Service and rely on the
#     bare hostname `kafka` resolving to kafka-0 via the headless A record.
#   - readinessProbe uses kafka-topics.sh; bitnami image ships it on PATH.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-bus
spec:
  type: ClusterIP
  clusterIP: None        # headless — also serves as the bootstrap address
  ports:
    - name: client
      port: 9092
      targetPort: 9092
      protocol: TCP
    - name: controller
      port: 9093
      targetPort: 9093
      protocol: TCP
  selector:
    app.kubernetes.io/name: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-bus
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: message-bus
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: kafka
          image: docker.io/bitnami/kafka:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_ENABLE_KRAFT
              value: "yes"
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka.iun-mosip-dev.svc.cluster.local:9093"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.iun-mosip-dev.svc.cluster.local:9092"
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: "iun-mosip-kraft-cluster-01"
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "kafka-topics.sh --bootstrap-server localhost:9092 --list"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1500Mi"
          volumeMounts:
            - name: data
              mountPath: /bitnami/kafka
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ocs-external-storagecluster-ceph-rbd
        resources:
          requests:
            storage: 10Gi
