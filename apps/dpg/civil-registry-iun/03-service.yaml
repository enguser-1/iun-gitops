# ============================================================================
# iun-civil-registry Service - ClusterIP standard
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: iun-civil-registry
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: iun-civil-registry
    app.kubernetes.io/instance: iun-civil-registry
    app.kubernetes.io/part-of: iun-platform
    iun.sn/dpg: civil-registry-custom
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: iun-civil-registry
    app.kubernetes.io/instance: iun-civil-registry
