# iun-cmu-bridge - identifiants OpenIMIS via Vault Secrets Operator (standard plateforme IUN).
# Ce manifeste ne contient AUCUN secret : c'est un POINTEUR vers un chemin Vault.
# Le VSO lit la valeur dans Vault (auth k8s via iun-opencrvs-auth) et materialise le
# Secret 'iun-cmu-bridge-creds' (cle openimis-password) que 02-deployment.yaml consomme.
#
# Auth deja en place : VaultAuth 'iun-opencrvs-auth' (role iun-opencrvs-role, k8s,
#   connection iun-platform/vault-heritage -> https://vault-active.security.svc:8200) = HEALTHY.
#
# >>> AVANT d'appliquer : ecrire le secret dans Vault (cf README-secret.md) :
#     vault kv put <MOUNT>/<PATH> openimis-password='<motdepasse>'
#
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: iun-cmu-bridge-creds
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: iun-cmu-bridge
    app.kubernetes.io/part-of: iun-platform
spec:
  type: kv-v2
  # ----- A CONFIRMER cote Vault (policy de iun-opencrvs-role) -----
  mount: heritage                      # TODO: nom du moteur KV-v2 sur le Vault heritage (`vault secrets list`)
  path: iun-opencrvs-dev/iun-cmu-bridge  # TODO: chemin du secret (convention <namespace>/<app>)
  # ---------------------------------------------------------------
  vaultAuthRef: iun-opencrvs-auth      # VaultAuth existante du namespace (HEALTHY)
  refreshAfter: 1h                     # resync periodique (rotation prise en compte)
  destination:
    name: iun-cmu-bridge-creds         # = le Secret reference par le Deployment
    create: true                       # le VSO cree et possede le Secret (toutes les cles de Vault)
    overwrite: true
