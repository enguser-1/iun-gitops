# iun-cmu-bridge - pont OpenCRVS(registered+UIN) -> OpenIMIS (insuree + policy CMU) - Leg B EF-07
# DRY_RUN=true par defaut : observer les logs avant d'activer (oc set env deploy/iun-cmu-bridge DRY_RUN=false)
# Prerequis OpenIMIS (DEMO_DATASET=false) : Product CMU, Location famille, Officer, user d'API.
#   Renseigner OPENIMIS_* (cf Discover-OpenimisRefs.ps1) avant de passer DRY_RUN=false.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iun-cmu-bridge
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: iun-cmu-bridge
    app.kubernetes.io/part-of: iun-platform
    iun.sn/dpg: cmu-custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iun-cmu-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iun-cmu-bridge
        app.kubernetes.io/part-of: iun-platform
    spec:
      containers:
        - name: bridge
          image: image-registry.openshift-image-registry.svc:5000/iun-opencrvs-dev/iun-cmu-bridge:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/hearth-dev"
            - name: OPENIMIS_GRAPHQL_URL
              value: "http://openimis-backend.iun-openimis-dev.svc.cluster.local:8000/api/graphql"
            - name: OPENIMIS_USER
              value: "iun-cmu-bridge"
            - name: OPENIMIS_PASSWORD
              # Secret iun-cmu-bridge-creds (gere hors-git ; cf 00-secret.example.yaml).
              # Creer : oc create secret generic iun-cmu-bridge-creds -n iun-opencrvs-dev
              #           --from-literal=openimis-password='<motdepasse>'
              valueFrom: { secretKeyRef: { name: iun-cmu-bridge-creds, key: openimis-password } }
            - name: OPENIMIS_PRODUCT_ID
              value: "15"     # CMUENF - CMU Gratuite Enfants 0-5 ans (seed_cmu_v1)
            - name: OPENIMIS_LOCATION_ID
              value: "71"     # Dakar Plateau (W) - leaf, = bureau etat civil
            - name: OPENIMIS_OFFICER_ID
              value: "48"     # officer IUNAUTO (seed_cmu_v1)
            - name: POLL_INTERVAL_S
              value: "30"
            - name: DRY_RUN
              value: "false"   # Leg B validee 2026-06-13 (affiliation CMU active)
          readinessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /ping, port: 8080 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
