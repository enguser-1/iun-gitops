# ============================================================================
# Secrets - PLACEHOLDERS pour bascule GitOps future
# ============================================================================
# En mode .ps1 direct (Week 2 partial), les vrais Secrets sont crees par
# 01-secrets.ps1 (passwords generes runtime, stockes sur le cluster, jamais
# ecrits en clair sur disque).
#
# Quand le repo passe en GitOps (Week 2 J+2 ou Week 3), remplacer ce fichier
# par des `VaultStaticSecret` (VSO) qui pointent sur les paths Vault :
#   - kv-iun/openimis/dev/db        -> openimis-db-app (CNPG-compatible)
#   - kv-iun/openimis/dev/broker    -> openimis-broker (CELERY_BROKER_URL)
#   - kv-iun/openimis/dev/redis     -> openimis-redis (CACHE_URL + REDIS_PASSWORD)
#   - kv-iun/openimis/dev/rabbitmq  -> openimis-rabbitmq-creds (admin)
#   - kv-iun/openimis/dev/django    -> openimis-django (SECRET_KEY, OPENSEARCH_PASSWORD)
#
# Pour l'instant : fichier vide intentionnel (juste un ConfigMap de marqueur
# pour kustomize). Le .ps1 01-secrets.ps1 prend le relais.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: openimis-secrets-policy
  namespace: iun-openimis-dev
  labels:
    iun.sn/role: secrets-policy-marker
data:
  policy: |
    Les Secrets de ce namespace sont crees runtime par
    sprint-2-scripts/week-2-openimis/01-secrets.ps1.
    Passwords aleatoires 32 chars, jamais ecrits sur disque, jamais commit.
    Bascule VSO/Vault prevue post-validation (cf. PLAN-SPRINT-2.md tache 2.x).
  secrets-attendus: |
    openimis-db-app         (basic-auth + DB_*, consomme par CNPG bootstrap + backend/worker)
    openimis-broker         (CELERY_BROKER_URL, consomme par backend + worker)
    openimis-redis          (CACHE_URL + REDIS_PASSWORD, consomme par backend + worker + redis)
    openimis-rabbitmq-creds (RABBITMQ_DEFAULT_USER/PASS/VHOST, consomme par RMQ STS)
    openimis-django         (SECRET_KEY + OPENSEARCH_PASSWORD, consomme par backend + worker)
