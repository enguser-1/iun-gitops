# ============================================================================
# Worker Celery - openimis-be:25.10 args=worker (corrige PITFALLS §2 et §5)
# ============================================================================
# Corrections vs ancien openimis-dev :
#   - args: ["start"] (entrypoint dispatcher - PAS de command override)
#     ATTENTION : args=start cf brief, mais entrypoint OpenIMIS dispatche
#     selon le 1er arg. Pour worker Celery c'est 'worker'. On utilise donc
#     args: ["worker"] qui declenche `celery -A openIMIS worker ...`
#   - CELERY_WORKER_CONCURRENCY=2 (env var Celery officielle, evite OOM 64 procs)
#   - 2 replicas MVP (scale up plus tard via HPA file RMQ)
#   - SCC iun-anyuid-caps (run UID openimis stable)
#   - Memory limits 1Gi (vs OOM initial sans limits)
#   - Connecte au meme Secret openimis-broker que le backend
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openimis-worker
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: openimis
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openimis
        app.kubernetes.io/component: worker
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      # MVP : meme contrainte que backend (image openimis-be sur compute01/02 uniquement)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - compute01.origins.heritage.africa
                      - compute02.origins.heritage.africa
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: openimis
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: ghcr.io/openimis/openimis-be:25.10
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - secretRef:
                name: openimis-db-app
            - secretRef:
                name: openimis-broker
            - secretRef:
                name: openimis-redis
            - secretRef:
                name: openimis-django
          env:
            - name: MODE
              value: PROD
            - name: DJANGO_LOG_HANDLER
              value: console
            - name: DJANGO_DB_LOG_HANDLER
              value: console
            - name: DJANGO_LOG_LEVEL
              value: INFO
            - name: CELERY_WORKER_CONCURRENCY
              value: "2"
            - name: CELERYD_CONCURRENCY  # alias historique - certains entrypoints le lisent
              value: "2"
            - name: SITE_ROOT
              value: api
            - name: OPENSEARCH_HOSTS
              value: http://openimis-opensearch:9200
            # PAS de OPENIMIS_CONF / volumeMount : voir explication 05-be-migrations.yaml
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "celery -A openIMIS inspect ping -d celery@$HOSTNAME"
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # PAS de volumes openimis-config : voir 05-be-migrations.yaml
