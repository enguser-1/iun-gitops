# ============================================================================
# CNPG Cluster - PostgreSQL pour OpenIMIS (rebuild iun-openimis-dev)
# ============================================================================
# 3 instances (1 primary + 2 standby) - HA legere MVP, scale up plus tard.
# StorageClass : ocs-external-storagecluster-ceph-rbd (block RWO, CHEAT-SHEET D2)
# Image : ghcr.io/cloudnative-pg/postgresql:16.4-bookworm (LTS)
#
# Le secret openimis-db-app est PRE-CREE par 01-secrets.ps1 en mode basic-auth
# (kubernetes.io/basic-auth) avec keys username/password. CNPG le reutilise via
# bootstrap.initdb.secret.name. Le meme secret embarque aussi DB_* env vars
# (DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD/DB_DEFAULT) pour envFrom dans
# backend/worker - CNPG ignore les keys supplementaires.
#
# Services CNPG generes auto :
#   openimis-db-rw  -> primary (read-write)  <- on l'utilise pour DB_HOST
#   openimis-db-ro  -> standbys (read-only)
#   openimis-db-r   -> any instance
# ============================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openimis-db
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: postgres
    iun.sn/dpg: openimis
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4-bookworm

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      work_mem: "16MB"
      maintenance_work_mem: "64MB"
      effective_cache_size: "1GB"
      log_min_duration_statement: "1000"
    pg_hba:
      - host all all all md5

  bootstrap:
    initdb:
      database: openimis
      owner: openimis
      # Reutilise le secret pre-cree par 01-secrets.ps1 (basic-auth + DB_* keys)
      secret:
        name: openimis-db-app
      # Extensions standards utiles a Django (uuid, full-text, etc.)
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;

  storage:
    storageClass: ocs-external-storagecluster-ceph-rbd
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  monitoring:
    enablePodMonitor: true
