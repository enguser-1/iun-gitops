# ============================================================================
# RabbitMQ 3.13 - broker Celery (corrige PITFALLS.md piege 5)
# ============================================================================
# Correction officielle :
#   - User dedie imis_celery + vhost openimis (PAS guest/guest restreint a localhost)
#   - RABBITMQ_DEFAULT_USER/PASS/VHOST depuis Secret openimis-rabbitmq-creds
#     (a la creation du noeud, RabbitMQ active automatiquement loopback_users=none
#      pour le DEFAULT_USER, PAS besoin de cookie-fix initContainer)
#   - fsGroup propre sur le PVC (UID 999 rabbitmq officiel)
#
# StatefulSet 1 replica MVP (HA broker plus tard via RabbitMQ Cluster Operator).
# PVC RWO 5Gi sur ocs-external-storagecluster-ceph-rbd.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: openimis-rabbitmq
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
    - name: management
      port: 15672
      targetPort: 15672
      protocol: TCP
  selector:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: openimis-rabbitmq-headless
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
  selector:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openimis-rabbitmq
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: openimis-rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openimis
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openimis
        app.kubernetes.io/component: rabbitmq
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: openimis-rabbitmq-creds  # RABBITMQ_DEFAULT_USER/PASS/VHOST
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: openimis-rabbitmq-creds
                  key: RABBITMQ_ERLANG_COOKIE
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: openimis
          app.kubernetes.io/component: rabbitmq
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ocs-external-storagecluster-ceph-rbd
        resources:
          requests:
            storage: 5Gi
