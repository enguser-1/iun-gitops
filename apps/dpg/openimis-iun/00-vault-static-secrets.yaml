# ============================================================================
# VaultStaticSecret - 5 secrets IUN OpenIMIS depuis Vault Heritage
# ============================================================================
# Remplace 00-secrets-placeholders.yaml (qui etait juste un marqueur) une fois
# que :
#   1. Mount KV-v2 "iun" cree cote Vault Heritage
#   2. Policy iun-openimis-policy creee (read/write sur iun/data/openimis/*)
#   3. Role k8s iun-openimis-role lie au SA default du ns iun-openimis-dev
#   4. Paths iun/openimis/dev/{db,broker,redis,rabbitmq,django} seedees avec
#      les valeurs extraites des Secrets OCP runtime (cf. push-secrets-to-vault.ps1)
#
# Convention Vault Heritage observee chez les autres tenants (CETUD/IAM) :
#   - mount: <tenant>             (singulier, sans prefixe kv-)
#   - path:  <dpg>/<env>/<resource>
#   - type:  kv-v2
#   - refreshAfter: 5m
#   - vaultAuthRef: <tenant>-<dpg>-auth (ns-local)
#
# rolloutRestartTargets : trigger rolling restart des Deployments backend/worker
# si la valeur du secret change cote Vault. Backend + Worker partagent les Secrets,
# on les rolling-restart les 2 si rotation. Frontend ne consomme aucun secret
# rote, donc pas dans la liste.
# ============================================================================
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openimis-db-app-vss
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: secrets-vso
    iun.sn/dpg: openimis
spec:
  vaultAuthRef: iun-openimis-auth
  mount: iun
  type: kv-v2
  path: openimis/dev/db
  refreshAfter: 5m
  destination:
    name: openimis-db-app
    create: true
    type: kubernetes.io/basic-auth
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: openimis-backend
    - kind: Deployment
      name: openimis-worker
    - kind: StatefulSet
      name: openimis-db
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openimis-broker-vss
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: secrets-vso
    iun.sn/dpg: openimis
spec:
  vaultAuthRef: iun-openimis-auth
  mount: iun
  type: kv-v2
  path: openimis/dev/broker
  refreshAfter: 5m
  destination:
    name: openimis-broker
    create: true
    type: Opaque
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: openimis-backend
    - kind: Deployment
      name: openimis-worker
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openimis-redis-vss
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: secrets-vso
    iun.sn/dpg: openimis
spec:
  vaultAuthRef: iun-openimis-auth
  mount: iun
  type: kv-v2
  path: openimis/dev/redis
  refreshAfter: 5m
  destination:
    name: openimis-redis
    create: true
    type: Opaque
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: openimis-backend
    - kind: Deployment
      name: openimis-worker
    - kind: Deployment
      name: openimis-redis
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openimis-rabbitmq-creds-vss
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: secrets-vso
    iun.sn/dpg: openimis
spec:
  vaultAuthRef: iun-openimis-auth
  mount: iun
  type: kv-v2
  path: openimis/dev/rabbitmq
  refreshAfter: 5m
  destination:
    name: openimis-rabbitmq-creds
    create: true
    type: Opaque
    overwrite: true
  rolloutRestartTargets:
    - kind: StatefulSet
      name: openimis-rabbitmq
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openimis-django-vss
  namespace: iun-openimis-dev
  labels:
    app.kubernetes.io/name: openimis
    app.kubernetes.io/component: secrets-vso
    iun.sn/dpg: openimis
spec:
  vaultAuthRef: iun-openimis-auth
  mount: iun
  type: kv-v2
  path: openimis/dev/django
  refreshAfter: 24h  # SECRET_KEY ne change pas souvent, OPENSEARCH_PASSWORD non plus
  destination:
    name: openimis-django
    create: true
    type: Opaque
    overwrite: true
  rolloutRestartTargets:
    - kind: Deployment
      name: openimis-backend
    - kind: Deployment
      name: openimis-worker
    - kind: StatefulSet
      name: openimis-opensearch
