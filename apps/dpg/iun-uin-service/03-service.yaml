# ============================================================================
# iun-uin-service Service - ClusterIP standard
# ============================================================================
# Consume par :
#   - Route OCP edge (acces external HTTPS)
#   - openHIM mediator MOSIP wrap (Sprint 4)
#   - OpenCRVS register birth (futur Sprint 4-5)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: iun-uin-service
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/name: iun-uin-service
    app.kubernetes.io/instance: iun-uin-service
    app.kubernetes.io/part-of: iun-platform
    iun.sn/dpg: uin-custom
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: iun-uin-service
    app.kubernetes.io/instance: iun-uin-service
