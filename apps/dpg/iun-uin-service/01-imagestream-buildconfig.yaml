# ============================================================================
# OCP ImageStream + BuildConfig pour iun-uin-service
# ============================================================================
# Strategy: binary docker. On-cluster build (pas besoin de docker local).
# Le source code est push via `oc start-build --from-dir` depuis local.
# Output -> ImageStream:latest accessible en `image-registry.openshift-image-registry.svc:5000/iun-mosip-dev/iun-uin-service:latest`
# ============================================================================
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: iun-uin-service
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/part-of: iun-platform
    iun.sn/dpg: uin-custom
    iun.sn/component: uin-generator
  annotations:
    iun.sn/purpose: "Custom MOSIP-replacement UIN generator (ADR-R01)"
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: iun-uin-service
  namespace: iun-mosip-dev
  labels:
    app.kubernetes.io/part-of: iun-platform
    iun.sn/dpg: uin-custom
spec:
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: iun-uin-service:latest
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
