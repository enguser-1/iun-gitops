# ============================================================================
# Kustomization iun-uin-service - sync order pour Argo CD Sprint 4
# ============================================================================
# 01 - ImageStream + BuildConfig (image source-of-truth)
# 02 - Deployment (consume ImageStreamTag)
# 03 - Service ClusterIP 8080
# 04 - Route OCP edge TLS (acces external)
#
# Pre-requis namespace iun-mosip-dev :
#   - CNPG mosip-postgres healthy (cluster.postgresql.cnpg.io/mosip-postgres)
#   - Secret mosip-postgres-superuser (user postgres + password)
#   - DB mosip_kernel initialisee (postgres-init fix #M2)
#   - NetworkPolicies socle Sprint 2 (allow-dns + allow-egress-intra-mosip)
# ============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iun-mosip-dev
commonLabels:
  app.kubernetes.io/part-of: iun-platform
  iun.sn/dpg: uin-custom
  iun.sn/environment: dev
resources:
  - 01-imagestream-buildconfig.yaml
  - 02-deployment.yaml
  - 03-service.yaml
  - 04-route.yaml
  - 05-networkpolicy-builds.yaml  # egress HTTPS pour pull images base
