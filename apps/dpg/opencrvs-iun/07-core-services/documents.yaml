# ============================================================================
# documents.yaml — OpenCRVS documents service (port 9050)
# ----------------------------------------------------------------------------
# Purpose      : uploads/downloads of birth certificates, ID scans to MinIO.
# Dependencies : MinIO Ready (buckets `ocrvs` and `documents` provisioned).
# Override     : Fallback image docker.io/opencrvs/ocrvs-documents:v1.9.13.
# Gotchas      :
#   - PITFALLS #12 — presigned URLs returned to the browser depend on
#     MINIO_SERVER_URL on the MinIO side. Validate iun-civil-docs-dev
#     resolves before testing uploads.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: documents
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: documents
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9050
      targetPort: 9050
      protocol: TCP
  selector:
    app.kubernetes.io/name: documents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: documents
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: documents
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-documents:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: documents
  template:
    metadata:
      labels:
        app.kubernetes.io/name: documents
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: documents
          image: ghcr.io/opencrvs/ocrvs-documents:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9050
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "9050"
            - name: MINIO_HOST
              value: "minio"
            - name: MINIO_PORT
              value: "9000"
            - name: MINIO_BUCKET
              value: "ocrvs"
            - name: DOCUMENTS_BUCKET
              value: "documents"
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-user } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: minio-creds, key: root-password } }
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 9050
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 9050
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
