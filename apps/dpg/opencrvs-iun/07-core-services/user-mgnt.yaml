# RECONCILED FROM LIVE 2026-07-13 (sync-prod-gitops.ps1)
# NODE_ENV=production + ELASTIC_APM_ACTIVE=false + env completes (envalid).
# auth/search : logger-fix monte en subPath (cf. ../18-logger-recursion-fix.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    iun.sn/image-tag-verified: 2026-06-03 ΓÇö ghcr.io/opencrvs/ocrvs-user-mgnt:v1.9.13
  labels:
    app.kubernetes.io/component: opencrvs
    app.kubernetes.io/name: user-mgnt
  name: user-mgnt
  namespace: iun-opencrvs-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: user-mgnt
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
      labels:
        app.kubernetes.io/component: opencrvs
        app.kubernetes.io/name: user-mgnt
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: USER_MANAGEMENT_HOST
          value: 0.0.0.0
        - name: USER_MANAGEMENT_PORT
          value: "3030"
        - name: MONGO_APP_USER
          valueFrom:
            secretKeyRef:
              key: app-username
              name: mongodb-creds
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: app-password
              name: mongodb-creds
        - name: MONGO_URL
          value: mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/user-mgnt
        - name: NOTIFICATION_URL
          value: http://notification:2020
        - name: COUNTRY_CONFIG_URL
          value: http://countryconfig:3040
        - name: AUTH_URL
          value: http://auth:4040
        - name: CERT_PUBLIC_KEY_PATH
          value: /secrets/jwt-public.pem
        - name: NODE_OPTIONS
          value: --max-old-space-size=2048 --dns-result-order=ipv4first
        - name: HOST
          value: 0.0.0.0
        - name: APPLICATION_CONFIG_URL
          value: http://config:2021/
        - name: DOCUMENTS_URL
          value: http://documents:9050/
        - name: FHIR_URL
          value: http://hearth:3447/fhir
        - name: METRICS_URL
          value: http://metrics:1050/
        - name: ELASTIC_APM_ACTIVE
          value: "false"
        image: ghcr.io/opencrvs/ocrvs-user-mgnt:v1.9.13
        imagePullPolicy: IfNotPresent
        name: user-mgnt
        ports:
        - containerPort: 3030
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /secrets
          name: jwt-keys
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      volumes:
      - name: jwt-keys
        secret:
          defaultMode: 256
          secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: opencrvs
    app.kubernetes.io/name: user-mgnt
  name: user-mgnt
  namespace: iun-opencrvs-dev
spec:
  clusterIP: 172.30.21.95
  clusterIPs:
  - 172.30.21.95
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 3030
    protocol: TCP
    targetPort: 3030
  selector:
    app.kubernetes.io/name: user-mgnt
  sessionAffinity: None
  type: ClusterIP
