# ============================================================================
# user-mgnt.yaml — OpenCRVS user-mgnt service (port 3030)
# ----------------------------------------------------------------------------
# Purpose      : CRUD on Practitioner / PractitionerRole / SystemRole.
# Dependencies : Mongo (user-mgnt DB), notification, jwt-keys.
# Override     : Fallback image docker.io/opencrvs/ocrvs-user-mgnt:v1.9.13.
# Gotchas      :
#   - Hashes passwords with bcrypt — slow on first user-bulk-load (~200ms/user).
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: user-mgnt
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: user-mgnt
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3030
      targetPort: 3030
      protocol: TCP
  selector:
    app.kubernetes.io/name: user-mgnt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-mgnt
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: user-mgnt
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-user-mgnt:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-mgnt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-mgnt
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: user-mgnt
          image: ghcr.io/opencrvs/ocrvs-user-mgnt:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: USER_MANAGEMENT_HOST
              value: "0.0.0.0"
            - name: USER_MANAGEMENT_PORT
              value: "3030"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/user-mgnt"
            - name: NOTIFICATION_URL
              value: "http://notification:2020"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 3030
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 3030
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
