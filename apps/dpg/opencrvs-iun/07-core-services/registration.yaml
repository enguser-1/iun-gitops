# ============================================================================
# registration.yaml — OpenCRVS registration / events service (port 5555)
# ----------------------------------------------------------------------------
# Purpose      : Birth/death/marriage event handler. NOTE : in the OpenCRVS
#                1.9 monorepo, this is actually the `events` service ; the
#                Lead asked for a Deployment named `registration` exposing
#                the same logic at port 5555, so dependent services point to
#                http://registration:3040.
# Dependencies : Hearth Ready, Mongo (events DB), workflow, gateway,
#                countryconfig.
# Override     : Fallback image docker.io/opencrvs/ocrvs-events:v1.9.13.
# Gotchas      :
#   - Deployment name = registration ; container image = ocrvs-events.
#   - Service exposes 3040 (Lead contract) routed to containerPort 5555.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: registration
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: registration
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3040
      targetPort: 5555
      protocol: TCP
  selector:
    app.kubernetes.io/name: registration
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: registration
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-events:v1.9.13 (aliased registration per Lead contract)"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registration
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: registration
          image: ghcr.io/opencrvs/ocrvs-events:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5555"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/events"
            - name: HEARTH_URL
              value: "http://hearth:3447/fhir"
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: GATEWAY_URL
              value: "http://gateway:7070"
            - name: WORKFLOW_URL
              value: "http://workflow:5050"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 5555
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 5555
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
