# ============================================================================
# config.yaml — OpenCRVS application-config service (port 2021)
# ----------------------------------------------------------------------------
# Purpose      : reads / writes application-level configuration (forms,
#                certificates templates, locations) backed by Mongo.
# Dependencies : Mongo (application-config DB), countryconfig.
# Override     : Fallback image docker.io/opencrvs/ocrvs-config:v1.9.13.
# Gotchas      :
#   - On first boot this service polls countryconfig for initial seed JSON.
#     If countryconfig is not Ready, config will retry every 30s.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: config
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: config
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 2021
      targetPort: 2021
      protocol: TCP
  selector:
    app.kubernetes.io/name: config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: config
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-config:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: config
          image: ghcr.io/opencrvs/ocrvs-config:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2021
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "2021"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/application-config"
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 2021
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 2021
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
