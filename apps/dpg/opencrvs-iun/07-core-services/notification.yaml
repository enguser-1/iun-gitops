# ============================================================================
# notification.yaml — OpenCRVS notification service (port 2020)
# ----------------------------------------------------------------------------
# Purpose      : send SMS / email notifications via countryconfig provider.
# Dependencies : Mongo (notification DB), countryconfig.
# Override     : Fallback image docker.io/opencrvs/ocrvs-notification:v1.9.13.
# Gotchas      :
#   - PITFALLS #11 — SMS provider is MOCKED in MVP (countryconfig returns
#     200 OK without actually sending). Real provider wired Sprint 3.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 2020
      targetPort: 2020
      protocol: TCP
  selector:
    app.kubernetes.io/name: notification
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-notification:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: notification
          image: ghcr.io/opencrvs/ocrvs-notification:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2020
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "2020"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/notification"
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: USER_MANAGEMENT_URL
              value: "http://user-mgnt:3030"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 2020
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 2020
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
