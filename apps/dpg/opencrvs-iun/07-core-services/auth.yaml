# ============================================================================
# auth.yaml — OpenCRVS auth service (port 4040)
# ----------------------------------------------------------------------------
# Purpose      : login + JWT issuer + token verify. Reads jwt-private.pem to
#                sign RS256 tokens (Node 22 enforces >= 2048 bits per
#                PITFALLS #15).
# Dependencies : Mongo Ready (user-mgnt DB) ; Redis Ready ; jwt-keys Secret.
# Override     : Image fallback docker.io/opencrvs/ocrvs-auth:v1.9.13 if
#                ghcr.io is unreachable (PITFALLS #13).
# Gotchas      :
#   - PITFALLS #7 — issued JWTs can exceed 8 KiB if claims include large
#     role tables. Document the IngressController bufferSize patch in README
#     if 502 BadGateway start appearing.
#   - PITFALLS #15 — RSA key must be >= 2048 bits.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4040
      targetPort: 4040
      protocol: TCP
  selector:
    app.kubernetes.io/name: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-auth:v1.9.13 (released 2026-05-08)"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: auth
          image: ghcr.io/opencrvs/ocrvs-auth:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4040
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: AUTH_HOST
              value: "0.0.0.0"
            - name: AUTH_PORT
              value: "4040"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/user-mgnt"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: redis-creds, key: password } }
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: USER_MANAGEMENT_URL
              value: "http://user-mgnt:3030"
            - name: NOTIFICATION_URL
              value: "http://notification:2020"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: CERT_PRIVATE_KEY_PATH
              value: "/secrets/jwt-private.pem"
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 4040
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 4040
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
