# auth/search : logger-fix monte en subPath (cf. ../18-logger-recursion-fix.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    iun.sn/image-tag-verified: 2026-06-03 ΓÇö ghcr.io/opencrvs/ocrvs-gateway:v1.9.13
  labels:
    app.kubernetes.io/component: opencrvs
    app.kubernetes.io/name: gateway
  name: gateway
  namespace: iun-opencrvs-dev
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
      labels:
        app.kubernetes.io/component: opencrvs
        app.kubernetes.io/name: gateway
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: "7070"
        - name: AUTH_URL
          value: http://auth:4040/
        - name: USER_MANAGEMENT_URL
          value: http://user-mgnt:3030/
        - name: SEARCH_URL
          value: http://search:9090/
        - name: WORKFLOW_URL
          value: http://workflow:5050/
        - name: CONFIG_URL
          value: http://config:2021/
        - name: DOCUMENTS_URL
          value: http://documents:9050/
        - name: NOTIFICATION_URL
          value: http://notification:2020/
        - name: COUNTRY_CONFIG_URL
          value: http://countryconfig:3040/
        - name: METRICS_URL
          value: http://metrics:1050/
        - name: REGISTRATION_URL
          value: http://registration:3040/
        - name: APPLICATION_CONFIG_URL
          value: http://config:2021/
        - name: HEARTH_URL
          value: http://hearth:3447/fhir
        - name: CERT_PUBLIC_KEY_PATH
          value: /secrets/jwt-public.pem
        - name: NODE_OPTIONS
          value: --max-old-space-size=2048 --dns-result-order=ipv4first
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_URL
          value: redis://redis:6379
        - name: FHIR_URL
          value: http://hearth:3447/fhir
        - name: WEBHOOKS_URL
          value: http://webhooks:2525/
        - name: EVENTS_URL
          value: http://registration:3040/
        - name: CLIENT_APP_URL
          value: https://iun-opencrvs-app-dev.apps.origins.heritage.africa
        - name: LOGIN_URL
          value: https://iun-civil-login-v2-dev.apps.origins.heritage.africa
        - name: COUNTRY
          value: SN
        - name: LANGUAGES
          value: fr,wo
        - name: DOMAIN
          value: apps.origins.heritage.africa
        - name: DISABLE_RATE_LIMIT
          value: "true"
        - name: CHECK_INVALID_TOKEN
          value: "false"
        - name: QA_ENV
          value: "true"
        - name: MINIO_BUCKET
          value: ocrvs
        - name: CONFIG_TOKEN_EXPIRY_SECONDS
          value: "604800"
        - name: CONFIG_SYSTEM_TOKEN_EXPIRY_SECONDS
          value: "600"
        - name: CONFIG_SMS_CODE_EXPIRY_SECONDS
          value: "600"
        - name: ELASTIC_APM_ACTIVE
          value: "false"
        image: ghcr.io/opencrvs/ocrvs-gateway:v1.9.13
        imagePullPolicy: IfNotPresent
        name: gateway
        ports:
        - containerPort: 7070
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /secrets
          name: jwt-keys
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccount: default
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      volumes:
      - name: jwt-keys
        secret:
          defaultMode: 256
          secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: opencrvs
    app.kubernetes.io/name: gateway
  name: gateway
  namespace: iun-opencrvs-dev
spec:
  clusterIP: 172.30.24.191
  clusterIPs:
  - 172.30.24.191
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 7070
    protocol: TCP
    targetPort: 7070
  selector:
    app.kubernetes.io/name: gateway
  sessionAffinity: None
  type: ClusterIP
