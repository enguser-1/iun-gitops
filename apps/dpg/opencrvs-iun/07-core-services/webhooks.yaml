# ============================================================================
# webhooks.yaml — OpenCRVS webhooks service (port 2525)
# ----------------------------------------------------------------------------
# Purpose      : dispatches outbound webhooks on lifecycle events
#                (BIRTH_REGISTERED -> mosip-api middleware).
# Dependencies : Mongo (webhooks DB), countryconfig-creds (HMAC signing).
# Override     : Fallback image docker.io/opencrvs/ocrvs-webhooks:v1.9.13.
# Gotchas      :
#   - The destination URL for BIRTH_REGISTERED is configured via the
#     OpenCRVS web UI (config service), NOT via env. Lead must POST the
#     subscription to gateway after first boot. URL : http://mosip-api:2024/events/birth.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: webhooks
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 2525
      targetPort: 2525
      protocol: TCP
  selector:
    app.kubernetes.io/name: webhooks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooks
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: webhooks
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-webhooks:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webhooks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhooks
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: webhooks
          image: ghcr.io/opencrvs/ocrvs-webhooks:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2525
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "development"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "2525"
            - name: MONGO_APP_USER
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-username } }
            - name: MONGO_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: mongodb-creds, key: app-password } }
            - name: MONGO_URL
              value: "mongodb://$(MONGO_APP_USER):$(MONGO_APP_PASSWORD)@mongo-headless:27017/webhooks"
            - name: AUTH_URL
              value: "http://auth:4040"
            - name: USER_MANAGEMENT_URL
              value: "http://user-mgnt:3030"
            - name: COUNTRY_CONFIG_URL
              value: "http://countryconfig:3040"
            - name: HMAC_WEBHOOK_SIGNING_SECRET
              valueFrom: { secretKeyRef: { name: countryconfig-creds, key: hmac-webhook-signing-secret } }
            - name: CERT_PUBLIC_KEY_PATH
              value: "/secrets/jwt-public.pem"
          volumeMounts:
            - name: jwt-keys
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 2525
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 2525
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0400
