# ============================================================================
# 00-secrets-placeholders.yaml — DOC ONLY (no live K8s secret material here)
# ----------------------------------------------------------------------------
# Purpose      : declarative placeholder so `oc apply -k .` does not fail.
#                Real Secrets are created by 01-secrets.ps1 with crypto-strong
#                random values (passwords 32 chars, RS256 keys >=2048 bits).
# Dependencies : Namespace iun-opencrvs-dev exists.
# Override     : NEVER put real credentials here. Use 01-secrets.ps1.
# Gotchas      :
#   - PITFALLS #11 Redis password is MANDATORY since OpenCRVS 1.9.0.
#   - PITFALLS #15 Node 22 enforces RSA >= 2048 bits for JWT.
#   - The secrets created at runtime are :
#     * mongodb-creds         (root-password, app-password, root-username, app-username)
#     * elasticsearch-creds   (elastic-password)
#     * redis-creds           (password)
#     * minio-creds           (root-user, root-password)
#     * jwt-keys              (jwt-private.pem, jwt-public.pem — RS256 4096)
#     * mosip-middleware-creds (OPENCRVS_RECORD_AUDIT_TOKEN, IUN_UIN_SERVICE_AUTH)
#     * countryconfig-creds   (HMAC-WEBHOOK-SIGNING-SECRET)
#     * docker-hub-creds      (dockerconfigjson — duplicated from iun-mosip-dev)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-placeholder-notice
  namespace: iun-opencrvs-dev
  labels:
    iun.sn/role: documentation
    app.kubernetes.io/part-of: opencrvs
  annotations:
    iun.sn/note: "See 01-secrets.ps1 for the actual Secret objects. NEVER commit credentials."
data:
  README: |
    Secrets for this namespace are created out-of-band by 01-secrets.ps1.
    The PS script reuses any pre-existing values (idempotent — no rotation
    unless -RotateSecrets is passed).
