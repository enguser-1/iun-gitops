# 18-logger-recursion-fix.yaml - workaround bug upstream OpenCRVS (<= v1.9.15)
# ----------------------------------------------------------------------------
# packages/commons logger : filterHealthCheckLogs rappelle logger.debug (hooke)
# sur tout log contenant 'get /ping 200' -> recursion infinie -> exit 1 en
# production a la premiere probe readiness. Touche auth et search.
# Ce logger.js patche remplace 'return logger.debug(...args)' par 'return'
# (= jeter les logs /ping, l'intention du filtre). Monte en subPath sur
# /app/packages/commons/build/dist/common/logger.js (deploys auth + search).
# Original : cowork/reports/logger.js.original. A RETIRER quand upstream fixe.
# ============================================================================
