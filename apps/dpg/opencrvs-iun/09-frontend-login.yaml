# ============================================================================
# 09-frontend-login.yaml — OpenCRVS login PWA (port 3020)
# ----------------------------------------------------------------------------
# Purpose      : login + 2FA UI. Posts credentials to auth service, receives
#                JWT, redirects to client (iun-opencrvs-app-dev).
# Dependencies : auth Ready ; Route iun-civil-login-dev.
# Override     : Fallback image docker.io/opencrvs/ocrvs-login:v1.9.13.
# Gotchas      :
#   - REACT_APP_CLIENT_APP_URL must match the client Route ; otherwise the
#     OAuth redirect_uri check rejects the login flow.
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: login
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: login
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3020
      targetPort: 3020
      protocol: TCP
  selector:
    app.kubernetes.io/name: login
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: login
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — ghcr.io/opencrvs/ocrvs-login:v1.9.13"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: login
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: login
          image: ghcr.io/opencrvs/ocrvs-login:v1.9.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3020
              protocol: TCP
          env:
            - name: REACT_APP_AUTH_API_URL
              value: "https://iun-civil-api-dev.apps.origins.heritage.africa/auth"
            - name: REACT_APP_CLIENT_APP_URL
              value: "https://iun-opencrvs-app-dev.apps.origins.heritage.africa"
            - name: REACT_APP_COUNTRY_CONFIG_URL
              value: "https://iun-civil-api-dev.apps.origins.heritage.africa/config"
          readinessProbe:
            httpGet:
              path: /
              port: 3020
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3020
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
