# ============================================================================
# 05-influxdb.yaml — InfluxDB 1.8.10 (metrics backend)
# ----------------------------------------------------------------------------
# Purpose      : time-series store for OpenCRVS `metrics` service (registration
#                counts, completion rates).
# Dependencies : ocs-external-storagecluster-ceph-rbd ; SCC iun-anyuid-caps.
# Override     : Production = InfluxDB 2.x with auth tokens. OpenCRVS 1.9
#                only supports 1.8.x line protocol.
# Gotchas      :
#   - We do NOT enable HTTP auth — internal-only, NPs protect access.
#   - Image is 1.8.10 (NOT 2.x) — OpenCRVS hardcoded the 1.x driver.
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-data
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: infra
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ocs-external-storagecluster-ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: infra
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP
  selector:
    app.kubernetes.io/name: influxdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: influxdb
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: infra
  annotations:
    iun.sn/image-tag-verified: "2026-06-03 — influxdb:1.8.10 (OpenCRVS 1.9 driver is 1.x)"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: influxdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: influxdb
        app.kubernetes.io/component: infra
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 1500
        fsGroup: 1500
      containers:
        - name: influxdb
          image: docker.io/influxdb:1.8.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: INFLUXDB_DB
              value: "ocrvs"
            - name: INFLUXDB_HTTP_AUTH_ENABLED
              value: "false"
            - name: INFLUXDB_REPORTING_DISABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/influxdb
          readinessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: influxdb-data
