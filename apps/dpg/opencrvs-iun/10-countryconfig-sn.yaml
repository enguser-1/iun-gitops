kind: ConfigMap
metadata:
  annotations:
    iun.sn/mvp-mode: mock
    iun.sn/note: CM live rapatrie (drift) + V2_EVENTS deplace dans FEATURES (fix boucle redirectToWorkqueue)
    iun.sn/reconciled-from-live: '2026-06-12'
    iun.sn/sprint-3-todo: fork farajaland repository and supply real form schemas + handlebars templates
  labels:
    app.kubernetes.io/component: opencrvs
    app.kubernetes.io/name: countryconfig
  name: countryconfig-sn-data
  namespace: iun-opencrvs-dev

---
apiVersion: v1
kind: Service
metadata:
  name: countryconfig
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: countryconfig
    app.kubernetes.io/component: opencrvs
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3040
      targetPort: 3040
      protocol: TCP
  selector:
    app.kubernetes.io/name: countryconfig
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: countryconfig
  namespace: iun-opencrvs-dev
  labels:
    app.kubernetes.io/name: countryconfig
    app.kubernetes.io/component: opencrvs
  annotations:
    iun.sn/mvp-mode: "mock"
    iun.sn/image-tag-verified: "2026-06-03 ??? nginx:alpine"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: countryconfig
  template:
    metadata:
      labels:
        app.kubernetes.io/name: countryconfig
        app.kubernetes.io/component: opencrvs
      annotations:
        openshift.io/required-scc: iun-anyuid-caps
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: docker-hub-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: countryconfig
          image: docker.io/nginxinc/nginx-unprivileged:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3040
              protocol: TCP
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: 3040
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /ping
              port: 3040
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: nginx-conf
          configMap:
            name: countryconfig-sn-data
            items:
              - key: default.conf
                path: default.conf
